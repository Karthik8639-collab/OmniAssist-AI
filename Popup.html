<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAssist AI Quick Controller</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body class="popup-body">
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <span class="logo">⚡</span>
        <h3>OmniAssist AI</h3>
      </div>
      <span class="badge-status">MV3 Active</span>
    </header>

    <main class="popup-main">
      <button class="btn primary full-width popup-btn" id="btn-open-dashboard">
        🖥️ Launch Memory Companion Dashboard
      </button>

      <button class="btn outline full-width popup-btn" id="btn-save-turn">
        📌 Bookmark Current Page Turn
      </button>

      <div class="popup-search-box">
        <input type="text" id="popup-search-input" placeholder="Quick search in-page..." />
        <button class="btn secondary" id="btn-popup-search">🔍 Search</button>
      </div>

      <div class="popup-stats" id="popup-stats-summary">
        <span>Memory Items: <strong id="popup-count-val">0</strong></span>
      </div>
    </main>

    <footer class="popup-footer">
      <span>Zero-Cloud Local Encryption Protocol</span>
    </footer>
  </div>

  <script src="Popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniAssist AI - Universal AI Companion Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">
          <h1>OmniAssist AI</h1>
          <span class="subtext">Universal Companion v4.0</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="all">
          <span class="icon">💬</span> All Memories (<span id="count-all">0</span>)
        </button>
        <button class="nav-item" data-view="favorites">
          <span class="icon">⭐</span> Bookmarks (<span id="count-fav">0</span>)
        </button>
        <button class="nav-item" data-view="gemini">
          <span class="icon">✨</span> Gemini Captures (<span id="count-gemini">0</span>)
        </button>
        <button class="nav-item" data-view="chatgpt">
          <span class="icon">🤖</span> ChatGPT Captures (<span id="count-gpt">0</span>)
        </button>
        <button class="nav-item" data-view="claude">
          <span class="icon">🟧</span> Claude Captures (<span id="count-claude">0</span>)
        </button>
        <button class="nav-item" data-view="other">
          <span class="icon">🌐</span> Web & Other (<span id="count-other">0</span>)
        </button>
      </nav>

      <div class="sidebar-footer">
        <button id="btn-open-add-modal" class="btn primary block">+ New Memory</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="search-bar-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchBar" placeholder="Search prompts across Gemini, ChatGPT, Claude..." />
          <button id="btn-clear-search" class="clear-search-btn" style="display:none;">✕</button>
        </div>

        <div class="header-actions">
          <button id="btn-load-demo" class="btn outline small" title="Load sample multi-provider AI data">Load Demo</button>
          <button id="btn-import-file" class="btn outline small">📥 Import JSON</button>
          <input type="file" id="file-input-json" accept=".json" style="display:none;" />
          <button id="btn-export-dropdown" class="btn secondary small">💾 Export ▾</button>
          <div id="export-menu" class="dropdown-menu" style="display:none;">
            <button id="export-json">Export JSON</button>
            <button id="export-md">Export Markdown</button>
          </div>
          <button id="btnClearAll" class="btn danger small">🗑️ Clear All</button>
        </div>
      </header>

      <section class="content-body">
        <div class="stats-banner">
          <div class="stat-card">
            <span class="stat-num" id="stat-total">0</span>
            <span class="stat-label">Total Saved</span>
          </div>
          <div class="stat-card">
            <span class="stat-num" id="stat-today">0</span>
            <span class="stat-label">Saved Today</span>
          </div>
          <div class="stat-card">
            <span class="stat-num" id="stat-storage">0 KB</span>
            <span class="stat-label">Local Storage</span>
          </div>
        </div>

        <div id="messagesContainer" class="messages-grid"></div>
      </section>
    </main>
  </div>

  <div id="modal-add" class="modal-backdrop" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>📌 Add New Memory</h3>
        <button class="modal-close" id="modal-add-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="input-title">Title / Topic</label>
          <input type="text" id="input-title" placeholder="e.g., Gemini 1.5 Pro Context Window comparison" />
        </div>
        <div class="form-group">
          <label for="input-provider">AI Provider</label>
          <select id="input-provider">
            <option value="Gemini">✨ Gemini</option>
            <option value="ChatGPT">🤖 ChatGPT</option>
            <option value="Claude">🟧 Claude</option>
            <option value="Perplexity">🔍 Perplexity</option>
            <option value="DeepSeek">🐋 DeepSeek</option>
            <option value="Poe">⚡ Poe</option>
            <option value="Web">🌐 Web / Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="input-text">Prompt & Answer Content</label>
          <textarea id="input-text" rows="6" placeholder="Paste conversation, code snippets, or AI output..."></textarea>
        </div>
        <div class="form-group">
          <label for="input-tags">Tags (comma separated)</label>
          <input type="text" id="input-tags" placeholder="gemini, benchmark, code" />
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-save-new-memory" class="btn primary">Save Memory</button>
      </div>
    </div>
  </div>

  <div id="modal-view" class="modal-backdrop" style="display:none;">
    <div class="modal-card large">
      <div class="modal-header">
        <h3 id="view-title">Memory Detail</h3>
        <button class="modal-close" id="modal-view-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="meta-info">
          <span id="view-provider" class="provider-badge">Provider</span> | <span id="view-time">Timestamp</span> | <span id="view-source">Source</span>
        </div>
        <pre id="view-text-content" class="code-preview"></pre>
      </div>
      <div class="modal-footer">
        <button id="btn-copy-view" class="btn secondary">📋 Copy Text</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAssist AI - Universal Chat Recall & Companion</title>
  <link rel="stylesheet" href="Style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">⚡</span>
        <h2>OmniAssist <span class="version">v3.0</span></h2>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="all">
          <span class="icon">📂</span> All Memories <span class="count-badge" id="count-all">0</span>
        </button>
        <button class="nav-item" data-view="favorites">
          <span class="icon">★</span> Favorites <span class="count-badge" id="count-fav">0</span>
        </button>

        <div class="nav-section-label">AI PROVIDERS</div>
        <button class="nav-item" data-view="gemini">
          <span class="icon">✨</span> Gemini <span class="count-badge" id="count-gemini">0</span>
        </button>
        <button class="nav-item" data-view="chatgpt">
          <span class="icon">🤖</span> ChatGPT <span class="count-badge" id="count-gpt">0</span>
        </button>
        <button class="nav-item" data-view="claude">
          <span class="icon">🟧</span> Claude <span class="count-badge" id="count-claude">0</span>
        </button>
        <button class="nav-item" data-view="other">
          <span class="icon">🌐</span> Other Platforms <span class="count-badge" id="count-other">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="stat-box">
          <div class="stat-title">Memory Allocation</div>
          <div class="stat-value" id="stat-storage">0 KB</div>
        </div>
        <button class="btn secondary full-width" id="btn-load-demo">🧪 Load Sample Demo</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="search-container">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchBar" placeholder="Search prompts, responses, or tags... (Ctrl+F)" />
          <button id="btn-clear-search" class="clear-search-btn" style="display:none;">✕</button>
        </div>

        <div class="action-toolbar">
          <button class="btn primary" id="btn-open-add-modal">➕ New Memory</button>

          <div class="dropdown-wrapper">
            <button class="btn outline" id="btn-export-dropdown">📤 Export ▼</button>
            <div class="dropdown-menu" id="export-menu" style="display:none;">
              <button id="export-json">💾 Export JSON Backup</button>
              <button id="export-md">📝 Export Markdown (.md)</button>
            </div>
          </div>

          <button class="btn outline" id="btn-import-file">📥 Import JSON</button>
          <input type="file" id="file-input-json" accept=".json" style="display:none;" />

          <button class="btn danger outline" id="btnClearAll">🗑️ Clear All</button>
        </div>
      </header>

      <div class="metrics-row">
        <div class="metric-card">
          <span class="metric-label">Total Saved Turns</span>
          <span class="metric-value" id="stat-total">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Saved Today</span>
          <span class="metric-value" id="stat-today">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Local Encryption</span>
          <span class="metric-value green">AES / LocalStorage</span>
        </div>
      </div>

      <div class="grid" id="messagesContainer"></div>
    </main>
  </div>

  <div class="modal-overlay" id="modal-add" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>📌 Add New AI Memory</h3>
        <button class="close-btn" id="modal-add-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Memory Title</label>
          <input type="text" id="input-title" placeholder="e.g. Python Asyncio TaskGroup Pattern" />
        </div>
        <div class="form-group">
          <label>AI Platform Provider</label>
          <select id="input-provider">
            <option value="Gemini">✨ Gemini</option>
            <option value="ChatGPT" selected>🤖 ChatGPT</option>
            <option value="Claude">🟧 Claude</option>
            <option value="Perplexity">🔍 Perplexity</option>
            <option value="DeepSeek">🐋 DeepSeek</option>
            <option value="Poe">⚡ Poe</option>
            <option value="Other">🌐 Custom Web Page</option>
          </select>
        </div>
        <div class="form-group">
          <label>Conversation Text / Prompt Response</label>
          <textarea id="input-text" rows="6" placeholder="Paste conversation turn content here..."></textarea>
        </div>
        <div class="form-group">
          <label>Tags (comma separated)</label>
          <input type="text" id="input-tags" placeholder="e.g. python, asyncio, code-snippet" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn primary full-width" id="btn-save-new-memory">Save Memory</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-view" style="display:none;">
    <div class="modal-card large">
      <div class="modal-header">
        <div>
          <span id="view-provider" class="provider-badge">Gemini</span>
          <h3 id="view-title" style="display:inline-block; margin-left:8px;">Memory Detail</h3>
        </div>
        <button class="close-btn" id="modal-view-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-meta-row">
          <span>🕒 <span id="view-time">--</span></span> |
          <span>🌐 Source: <span id="view-source">--</span></span>
        </div>
        <pre class="code-view-block" id="view-text-content"></pre>
      </div>
      <div class="modal-footer">
        <button class="btn outline" id="btn-copy-view">📋 Copy Content</button>
      </div>
    </div>
  </div>

  <script src="App.js"></script>
</body>
</html>
